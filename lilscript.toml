# lil2-hast-util-to-jsx-runtime: hast columns to elements through the runtime's jsx/jsxs. 
[policy]
version = 3

[policy.tactics]
startup-reconstruction = "on"
recurring-reconstruction = "off"
string-array-packing = "off"

[javascript]
priority = "size-first"
assume_pristine_builtins = true
strip_debug = true
assume_pure_property_reads = true
assume_unconstructed_callbacks = true

[effort]
level = 12

[objective]
codecs = "brotli"

[mangle]
identifiers = true
properties = true
pool_strings = true

[delivery]
# Functions created at load are `function`, which engines parse on first call (V8 parses arrows at import).
lazy_functions = true
mode = "single"
directory = "dist"
entry_names = "to-jsx-runtime.js"

[delivery.entries]
index = "src/index.lil"
